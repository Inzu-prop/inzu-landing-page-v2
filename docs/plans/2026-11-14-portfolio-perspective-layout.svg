<text x="24" y="116" font-size="22" letter-spacing="-.4" fill="#213a2a">portfolio.</text>
<text x="24" y="149" font-size="14" fill="#455e4d">Bring existing property and unit records.</text>
<rect x="24" y="173" width="296" height="27" rx="7" fill="#f8f9f4"/><rect x="36" y="182" width="50" height="8" rx="4" fill="#90b494"/><rect x="98" y="182" width="118" height="8" rx="4" fill="#c4d5b7"/></g>
