<text x="24" y="84" font-size="25" letter-spacing="-.6" fill="#213a2a">A place for</text>
<text x="24" y="116" font-size="22" letter-spacing="-.4" fill="#213a2a">your tenants.</text>
<text x="24" y="149" font-size="14" fill="#455e4d">Unit, invoice and payment records.</text>
