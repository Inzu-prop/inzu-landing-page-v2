<text x="84" y="154" fill="#f8f9f4" font-size="50" letter-spacing="-2">Your portfolio. In perspective.</text>
<text x="84" y="198" fill="#c0d0bd" font-size="17">Six content cards. One supplied Inzu mark. A continuous connection into the next section.</text>
