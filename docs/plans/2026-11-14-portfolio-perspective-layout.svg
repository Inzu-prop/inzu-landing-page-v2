<title id="title">Proposed Inzu portfolio composition</title>
<desc id="desc">Planning schematic. Six cards connect to a central supplied Inzu mark. The central thread continues into the first feature frame below. Import and channel connections are labeled Planned. Final responsive styling and measured ribbons will be implemented separately.</desc>
